<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login complete — HappyThought</title>
<style>
:root{--bg:#faf7f2;--fg:#2a2420;--muted:#6b6058;--accent:#b5482b}
@media (prefers-color-scheme:dark){:root{--bg:#1a1714;--fg:#eee6dc;--muted:#a89c90;--accent:#e07a55}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:64px 20px}
h1{font-size:24px;margin:0 0 12px}.muted{color:var(--muted)}
</style></head>
<body><main>
<h1 id="t">TikTok 연결 중…</h1>
<p id="m" class="muted">잠시만 기다려 주세요.</p>
<script>
// TikTok 로그인 후 돌아오는 페이지.
// 받은 code/state 를 사장님 PC에서 대기 중인 업로드 프로그램(localhost:8765)으로 넘겨줍니다.
// 이 페이지는 아무 정보도 저장하거나 다른 곳으로 보내지 않습니다.
(function () {
  var q = window.location.search;
  var p = new URLSearchParams(q);
  if (p.get("error")) {
    document.getElementById("t").textContent = "연결이 취소되었습니다";
    document.getElementById("m").textContent = p.get("error_description") || p.get("error");
    return;
  }
  if (!p.get("code")) {
    document.getElementById("t").textContent = "HappyThought Uploader";
    document.getElementById("m").textContent = "TikTok 로그인 후 돌아오는 페이지입니다.";
    return;
  }
  window.location.replace("http://localhost:8765/callback" + q);
})();
</script>
</main></body></html>
